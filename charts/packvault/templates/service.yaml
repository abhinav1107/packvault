apiVersion: v1
kind: Service
metadata:
  name: {{ include "packvault.fullname" . }}
  labels:
    {{- include "packvault.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.opsPort }}
      targetPort: ops
      protocol: TCP
      name: ops
  selector:
    {{- include "packvault.selectorLabels" . | nindent 4 }}
