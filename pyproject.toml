[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packvault"
dynamic = ["version"]
description = "Secure Maven package hosting over local or S3-compatible storage"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "PackVault Contributors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "argon2-cffi>=23.1.0",
    "authlib>=1.3.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "prometheus-client>=0.21.0",
    "aioboto3>=13.2.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[project.scripts]
packvault = "packvault.main:main"

[tool.hatch.version]
path = "packvault/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["packvault"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"packvault/api/**" = ["B008"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
