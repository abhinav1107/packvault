<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PackVault — Error</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="container">
    <h1>Something went wrong</h1>
    <div class="banner error" role="alert">
      <p>{{ message }}</p>
      <p class="reference">Reference: <code>{{ request_id }}</code></p>
    </div>
    <p><a class="button secondary" href="/login">Back to sign in</a></p>
  </main>
</body>
</html>
